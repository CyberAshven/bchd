# TEST ONLY: runs gcash/neutrino's own CI script on trees of the neutrino PR
# branches, copied into this throwaway branch, as the neutrino fork's
# Actions are not enabled. Not for upstream.
name: neutrino-ci-test-only
on:
  push:
    branches:
      - ci-neutrino
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        tree: [n52, n53, n54, n56]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install golangci-lint
        run: curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.14.0
      - name: Run goclean.sh
        working-directory: ${{ matrix.tree }}
        run: bash ./goclean.sh
