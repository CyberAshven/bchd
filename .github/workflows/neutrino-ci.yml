# TEST ONLY: runs gcash/neutrino's own CI script on a branch of the neutrino
# fork, whose Actions are not enabled. Not for upstream.
name: neutrino-ci-test-only
on:
  push:
    branches:
      - ci-neutrino
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Read the neutrino ref to test
        id: ref
        run: echo "ref=$(cat neutrino-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: CyberAshven/neutrino
          ref: ${{ steps.ref.outputs.ref }}
          path: neutrino
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install golangci-lint
        run: curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.14.0
      - name: Run goclean.sh
        working-directory: neutrino
        run: ./goclean.sh
