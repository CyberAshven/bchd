# TEST ONLY: runs gcash/bchwallet's own CI script on commits of the bchwallet
# fork, whose Actions are not enabled, one job for each ref listed in
# bchwallet-ref. Not for upstream.
name: bchwallet-ci-test-only
on:
  push:
    branches:
      - ci-bchwallet
permissions:
  contents: read
jobs:
  refs:
    runs-on: ubuntu-latest
    outputs:
      refs: ${{ steps.refs.outputs.refs }}
    steps:
      - uses: actions/checkout@v4
      - id: refs
        run: echo "refs=$(grep -v '^ *$' bchwallet-ref | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
  build:
    needs: refs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJson(needs.refs.outputs.refs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: CyberAshven/bchwallet
          ref: ${{ matrix.ref }}
          path: bchwallet
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install golangci-lint
        run: curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.14.0
      - name: Run goclean.sh
        working-directory: bchwallet
        run: ./goclean.sh
